services:

  # ─── PostgreSQL ─────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: cfd-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cfd_db}
      POSTGRES_USER: ${POSTGRES_USER:-cfd_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cfd_user} -d ${POSTGRES_DB:-cfd_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cfd_net

  # ─── Application ────────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cfd-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-5000}:5000"
    env_file: .env
    environment:
      NODE_ENV: production
      # Overrides DATABASE_URL from .env to use internal Docker network hostname
      DATABASE_URL: postgresql://${POSTGRES_USER:-cfd_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-cfd_db}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/assets
    networks:
      - cfd_net

volumes:
  postgres_data:
  uploads:

networks:
  cfd_net:
    driver: bridge
