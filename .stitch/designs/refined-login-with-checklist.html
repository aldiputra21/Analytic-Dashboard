<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "outline-variant": "#e7bdb8",
                        "tertiary-fixed-dim": "#8ecdff",
                        "on-tertiary-container": "#f8faff",
                        "primary-fixed-dim": "#ffb4ac",
                        "surface-container-high": "#eae7e7",
                        "error": "#ba1a1a",
                        "on-error-container": "#93000a",
                        "background": "#fcf9f8",
                        "secondary-fixed-dim": "#c8c6c5",
                        "tertiary-container": "#007ab3",
                        "outline": "#926f6b",
                        "on-secondary": "#ffffff",
                        "on-background": "#1c1b1b",
                        "primary-container": "#e21f26",
                        "error-container": "#ffdad6",
                        "on-tertiary": "#ffffff",
                        "on-secondary-fixed": "#1c1b1b",
                        "on-surface-variant": "#5d3f3c",
                        "on-secondary-container": "#636262",
                        "on-tertiary-fixed": "#001e30",
                        "on-secondary-fixed-variant": "#474746",
                        "primary": "#ba0015",
                        "surface-bright": "#fcf9f8",
                        "surface": "#fcf9f8",
                        "on-primary-fixed": "#410003",
                        "secondary-fixed": "#e5e2e1",
                        "surface-container-highest": "#e5e2e1",
                        "on-tertiary-fixed-variant": "#004b70",
                        "primary-fixed": "#ffdad6",
                        "on-error": "#ffffff",
                        "inverse-on-surface": "#f3f0ef",
                        "surface-container": "#f0eded",
                        "on-primary-container": "#fffaf9",
                        "surface-container-lowest": "#ffffff",
                        "on-surface": "#1c1b1b",
                        "secondary-container": "#e2dfde",
                        "tertiary": "#00608e",
                        "surface-variant": "#e5e2e1",
                        "on-primary": "#ffffff",
                        "surface-tint": "#c00016",
                        "on-primary-fixed-variant": "#93000e",
                        "secondary": "#5f5e5e",
                        "inverse-primary": "#ffb4ac",
                        "inverse-surface": "#313030",
                        "surface-container-low": "#f6f3f2",
                        "surface-dim": "#dcd9d9",
                        "tertiary-fixed": "#cae6ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "fontFamily": {
                        "headline": ["Manrope"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .kinetic-gradient {
            background: linear-gradient(135deg, #ba0015 0%, #e21f26 100%);
        }
        .clean-white-gradient {
            background: radial-gradient(circle at 10% 20%, rgba(226, 31, 38, 0.03) 0%, rgba(248, 246, 246, 1) 90%);
        }
    </style>
</head>
<body class="bg-background font-body text-on-surface">
<main class="relative min-h-screen w-full flex flex-col md:flex-row overflow-hidden">
<!-- Left Side: Hero Area -->
<section class="relative w-full md:w-1/2 flex flex-col items-center justify-center p-8 md:p-16 lg:p-24 text-center clean-white-gradient">
<!-- Decorative Branding Element -->
<div class="absolute top-0 left-0 w-full h-1 bg-primary"></div>
<div class="z-10 flex flex-col items-center gap-8">
<div class="w-full max-w-xs md:max-w-sm">
<img alt="Corporate Brand Logo" class="w-full h-auto object-contain" src="https://lh3.googleusercontent.com/aida/ADBb0uh7ai5zyxmMh_RJK61x07LDwjmPrQRtiwCXdZPVReluH5iJsVpN4mIRQFq2FXpyiBKTa_J5AlX0gEdfleER3lOEa8otHqfYWCZj0z1Z3Rf9UoP0iUaT_tTMVktuuzEU-RVh4evwIGHis8nHeL0f9MU9D6Oe7YxyyuiQkH_x32jGvjT2EAUAiU7bmDGP0yC-geOOb1MXY0ca0awIW_bUTmKSIvcjWZZ_kY4XU0G1j9A2BDKc_xLa-kadOKZeooIGF8gVbsGRNHaI2-U"/>
</div>
<div class="">
<h1 class="font-headline text-on-surface text-2xl md:text-3xl font-extrabold leading-tight tracking-tight text-xl md:text-2xl"><ul class="flex flex-col gap-4 text-left w-full max-w-sm mx-auto">
<li class="flex items-center gap-3 p-3 rounded-lg hover:bg-primary/5 transition-colors group">
<span class="material-symbols-outlined text-[#E21F26] font-bold select-none group-hover:scale-110 transition-transform" style="font-variation-settings: 'FILL' 1, 'wght' 700;">check_circle</span>
<span class="font-headline text-on-surface text-sm md:text-base font-extrabold uppercase tracking-widest">Corporate Financial Dashboard</span>
</li>
<li class="flex items-center gap-3 p-3 rounded-lg hover:bg-primary/5 transition-colors group">
<span class="material-symbols-outlined text-[#E21F26] font-bold select-none group-hover:scale-110 transition-transform" style="font-variation-settings: 'FILL' 1, 'wght' 700;">check_circle</span>
<span class="font-headline text-on-surface text-sm md:text-base font-extrabold uppercase tracking-widest">Customer Relationship Management</span>
</li>
</ul></h1>
</div>
</div>
<!-- Subtle background texture removed as per "clean white gradient" request -->
</section>
<!-- Right Side: Login Form -->
<section class="w-full md:w-1/2 flex items-center justify-center p-6 md:p-12 lg:p-20 bg-surface-container-low/50 relative"><div class="absolute top-6 right-8 flex items-center gap-2 cursor-pointer text-secondary hover:text-primary transition-colors">
<span class="material-symbols-outlined text-xl">language</span>
<span class="text-xs font-bold uppercase tracking-wider">ID</span>
</div>
<div class="w-full bg-surface-container-lowest rounded-xl p-8 md:p-10 shadow-[0_20px_40px_rgba(28,27,27,0.05)] border-t-4 border-primary">
<header class="mb-10">
<h2 class="font-headline text-2xl font-bold text-on-surface mb-2">Sign In</h2>
<p class="text-secondary text-sm">Enter your credentials to access the executive dashboard</p>
</header>
<form class="space-y-6">
<div class="space-y-2">
<label class="block font-label text-sm font-medium text-on-surface" for="email">Email Address</label>
<div class="relative group">
<input class="w-full h-14 px-4 bg-surface-container border-none rounded-lg focus:ring-0 focus:bg-surface-container-high transition-colors placeholder:text-outline/60 text-on-surface" id="email" placeholder="name@company.com" type="email"/>
<div class="absolute bottom-0 left-0 h-0.5 w-0 group-focus-within:w-full bg-primary transition-all duration-300"></div>
</div>
</div>
<div class="space-y-2">
<div class="flex justify-between items-center">
<label class="block font-label text-sm font-medium text-on-surface" for="password">Password</label>
<a class="text-xs font-semibold text-primary hover:text-primary-container transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative group flex items-center bg-surface-container rounded-lg focus-within:bg-surface-container-high transition-colors">
<input class="flex-1 h-14 px-4 bg-transparent border-none focus:ring-0 placeholder:text-outline/60 text-on-surface" id="password" placeholder="••••••••" type="password"/>
<button class="px-4 text-outline hover:text-primary transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined" data-icon="Eye">visibility</span>
</button>
<div class="absolute bottom-0 left-0 h-0.5 w-0 group-focus-within:w-full bg-primary transition-all duration-300"></div>
</div>
</div>
<div class="flex items-center gap-3 py-2">
<input class="w-4 h-4 rounded border-outline-variant text-primary focus:ring-primary/20 bg-surface-container" id="remember" type="checkbox"/>
<label class="text-sm text-secondary font-medium select-none" for="remember">Remember this device</label>
</div>
<button class="w-full h-14 kinetic-gradient text-white font-headline font-bold rounded-lg shadow-lg shadow-primary/20 hover:brightness-110 active:scale-[0.98] transition-all" type="submit"><div class="flex items-center justify-center gap-2"><span>Sign In</span><span class="material-symbols-outlined">login</span></div></button>
</form>
<div class="mt-8 pt-8 border-t border-surface-container-high text-center">
<p class="text-sm text-secondary">
                    Don't have an account? 
                    <a class="font-bold text-primary hover:underline underline-offset-4" href="#">Contact Administrator</a>
</p>
</div>
</div>
</section>
</main>
</body></html>
